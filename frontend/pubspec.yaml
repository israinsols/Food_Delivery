name: foodos
description: "FoodOS - Multi-Tenant Food Business Management SaaS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Local Storage
  flutter_secure_storage: ^9.2.4

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  gap: ^3.0.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.3

  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/biryani.jpg
    - assets/images/kabab.jpg
    - assets/images/naan.jpg
    - assets/images/samosa.jpg
    - assets/images/pakora.jpg
    - assets/images/cold_drink.jpg
    - assets/images/lassi.jpg
    - assets/images/gulab_jamun.jpg
    - assets/icons/
